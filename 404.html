<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません | 対義語ほんやく</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⇄</text></svg>">
<style>
  :root { --ground:#eceef3; --ink:#161922; --muted:#6c7385; --pole-b:#bc4529; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ground:#0d0f15; --ink:#e9ebf2; --muted:#949cae; --pole-b:#f08a68; }
  }
  :root[data-theme="dark"] { --ground:#0d0f15; --ink:#e9ebf2; --muted:#949cae; --pole-b:#f08a68; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--ground); color: var(--ink); text-align: center; line-height: 1.9;
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  }
  .eyebrow { font-size: .7rem; letter-spacing: .34em; color: var(--muted); margin: 0 0 14px; }
  h1 { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-weight: 900;
       font-size: clamp(1.8rem, 6vw, 3rem); margin: 0; letter-spacing: .04em; }
  h1 span { color: var(--pole-b); }
  p.lead { color: var(--muted); font-size: .92rem; }
  a { display: inline-block; margin-top: 22px; padding: 12px 26px; border-radius: 999px;
      background: var(--ink); color: var(--ground); text-decoration: none; font-size: .9rem; font-weight: 700; }
</style>
</head>
<body>
  <div>
    <p class="eyebrow">404</p>
    <h1>ページが<span>見つかりません</span></h1>
    <p class="lead">URL が変更されたか、削除された可能性があります。</p>
    <a href="/-/">トップページへ戻る</a>
  </div>
</body>
</html>
