name: Test & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 変換エンジンのテスト
        run: node tests/run.js

  deploy:
    # main への push のときだけ公開する（プルリクではテストのみ）
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 公開するファイルだけ集める
        run: |
          mkdir -p _site
          cp index.html antonym-list.html what-is-antonym.html guide.html \
             about.html privacy.html terms.html contact.html 404.html _site/
          cp robots.txt sitemap.xml ads.txt _site/
          cp -r assets src _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
