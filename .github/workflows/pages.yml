name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 変換エンジンのテスト
        run: node tests/run.js

  deploy:
    # main への push のときだけ公開する（プルリクではテストのみ）
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 公開するファイルだけ集める
        run: |
          mkdir -p _site
          cp index.html antonym-list.html what-is-antonym.html guide.html \
             about.html privacy.html terms.html contact.html 404.html _site/
          cp robots.txt sitemap.xml ads.txt _site/
          cp -r assets src _site/
          touch _site/.nojekyll

      # Pages の「サイト作成」API は GITHUB_TOKEN では叩けないため、
      # gh-pages ブランチへ push する方式で公開する。
      # （このブランチが存在すると GitHub Pages が有効になる）
      - name: gh-pages ブランチへ公開
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q
          git checkout -qb gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA:0:7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "公開先: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
